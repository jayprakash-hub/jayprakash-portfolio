<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Jayprakash Gupta</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial,sans-serif;
            background: #07111f;
            color: white;
        }

        nav {
            padding: 18px 8%;
            background: #050d18;
            display: flex;
            justify-content: space-between;
        }

        .logo {
            color: #00e5ff;
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 90px 25px;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            margin-bottom: 50px;
        }

        h1 span {
            color: #00e5ff;
        }

        .contact-box {
            background: #0d1a2b;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #1c3048;
        }

        input,
        textarea {
            width: 100%;
            margin-bottom: 18px;
            padding: 15px;
            background: #07111f;
            border: 1px solid #253a52;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #00e5ff;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: #00e5ff;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00c9df;
        }

        .info {
            margin-top: 30px;
            text-align: center;
            color: #aeb8c5;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #040b14;
            color: #999;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">JP.</div>

    <div>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/projects">Projects</a>
        <a href="/skills">Skills</a>
    </div>
</nav>

<div class="container">

    <h1>Contact <span>Me</span></h1>

    <div class="contact-box">

        <form action="/contact" method="post">

            <input
                    type="text"
                    name="name"
                    placeholder="Your Name"
                    required>

            <input
                    type="email"
                    name="email"
                    placeholder="Your Email"
                    required>

            <input
                    type="text"
                    name="subject"
                    placeholder="Subject"
                    required>

            <textarea
                    name="message"
                    placeholder="Write your message..."
                    required></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

        <div class="info">
            <p>Email: your-email@gmail.com</p>
            <p>Location: Bhopal, Madhya Pradesh, India</p>
        </div>

    </div>

</div>

<footer>
    © 2026 Jayprakash Gupta
</footer>

</body>
</html>
